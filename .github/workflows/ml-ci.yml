
name: E-commerce ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train e-commerce model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t ecommerce-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name ecommerce-ml-container \
            -p 5000:5000 \
            ecommerce-ml:${{ github.sha }}

      - name: Wait for application health
        run: |
          for i in {1..15}; do
            if curl --fail --silent \
              http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          docker logs ecommerce-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Gender": "Female",
              "Product_Category": "Electronics",
              "Quantity": 2,
              "Price": 1500.0,
              "Payment_Method": "Credit Card",
              "City": "Guntur",
              "Customer_Rating": 4
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"predicted_order_status"'

      - name: Show Docker container logs
        if: always()
        run: docker logs ecommerce-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f ecommerce-ml-container || true
